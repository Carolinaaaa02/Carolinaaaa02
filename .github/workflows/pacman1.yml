name: generate pacman game

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: generate pacman-contribution-graph.svg
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      # Modifica los colores del SVG para adaptarlo a fondo oscuro
      - name: Convert SVG to dark mode
        run: |
          sed -i 's/#ffffff/#0d1117/gi' dist/pacman-contribution-graph.svg
          sed -i 's/#fff/#0d1117/gi' dist/pacman-contribution-graph.svg
          sed -i 's/#ebedf0/#161b22/gi' dist/pacman-contribution-graph.svg
          sed -i 's/#e1e4e8/#21262d/gi' dist/pacman-contribution-graph.svg
          sed -i 's/fill="#000000"/fill="#c9d1d9"/gi' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#000000"/stroke="#30363d"/gi' dist/pacman-contribution-graph.svg
          sed -i 's/stroke="#000"/stroke="#30363d"/gi' dist/pacman-contribution-graph.svg

      - name: push pacman-contribution-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
